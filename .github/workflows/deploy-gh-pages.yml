# SUNSET 2026-05-17 — GitHub Pages was deprecated in favour of the Docker
# deploy at my.thehappy.clinic/clinician/ (see PR #2's staging-deploy-trigger
# workflow + thc-portal's deploy.yml for how the clinician portal now ships).
#
# Trigger changed to workflow_dispatch only so pushes to main no longer fire
# a deploy. The file is intentionally NOT deleted — keeping it here preserves
# the historical context and the redirect index.html that's currently live at
# the old GH Pages URL (see PR adding src/index.html in this repo).
#
# To re-enable temporarily for any reason, run manually via the GitHub UI
# (Actions tab → Deploy to GitHub Pages → Run workflow) and re-add the
# push trigger if needed.

name: Deploy to GitHub Pages (SUNSET)

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Sunset notice
        run: |
          echo "===================================================================="
          echo "GitHub Pages deploy was sunset on 2026-05-17."
          echo "Canonical clinician portal: https://my.thehappy.clinic/clinician/"
          echo "===================================================================="
          echo "Continuing the manual deploy because workflow_dispatch was invoked."

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'src'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
